<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Ingredientes</title>

    <style>
        td {
            border: 1px solid gray;
            padding: 5px;
        }

        thead {
            background-color: rgb(177, 177, 177);
        }
    </style>
</head>

<body>

    <div>

        <h1>Tabela de Ingredientes</h1>

        <table>
            <thead>
                <td><strong>Ingrediente</strong></td>
                <td><strong>Quantidade</strong></td>
                <td><strong>Unidade de Medida</strong></td>
            </thead>
            <tbody>
                <tr>
                    <td>Farinha</td>
                    <td>300</td>
                    <td>grama</td>
                </tr>

                <tr>
                    <td>Ovo</td>
                    <td>100</td>
                    <td>grama</td>
                </tr>

                <tr>
                    <td>Cenoura</td>
                    <td>100</td>
                    <td>grama</td>
                </tr>

                <tr>
                    <td>Leite</td>
                    <td>200</td>
                    <td>mililitros</td>
                </tr>

            </tbody>
        </table>

    </div>
</body>

</html>
