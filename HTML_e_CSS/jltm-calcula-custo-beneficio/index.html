<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custo Benefício</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <header>
        <a href="#">
            <h2>Calc Custo</h2>
        </a>
        <nav class="nav">
            <a href="#" class="active">Inicio</a>
            <a href="#">Sobre</a>
        </nav>
    </header>
    <main>
        <div id="custoBen">

            <h1>Calculadora de Desconto</h1>
            <form id="calc-form" class="form-control bg-dark text-secondary">
                <div class="mb-3 my-2">
                    <label for="preco-unitario">Preço Unitário:</label>
                    <input id="preco-unitario" class="form-control border-secundary" type="number" required>
                </div>

                <div>
                    <label for="quantidade">Quantidade:</label>
                    <input id="quantidade" class="form-control border-secundary" type="number" id="quantidade" required>
                </div>

                <div>
                    <label for="desconto">Desconto (%):</label>
                    <input id="desconto" class="form-control border-secundary" type="number" required>
                </div>

                <button id="btnCalc" class="btn btn-light">Calcular</button>
            </form>
            <div id="result">
                <!-- Renderização do resultado -->
            </div>
        </div>
    </main>
    <footer>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="module" src="./script.js"></script>
</body>

</html>
